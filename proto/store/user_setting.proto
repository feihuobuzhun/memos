syntax = "proto3";

package memos.store;

import "google/protobuf/timestamp.proto";
import "google/type/color.proto";

option go_package = "gen/store";

message UserSetting {
  enum Key {
    KEY_UNSPECIFIED = 0;
    // General user settings.
    GENERAL = 1;
    // The memo views of the user.
    MEMO_VIEWS = 4;
    // The webhooks of the user.
    WEBHOOKS = 5;
    // Refresh tokens for the user.
    REFRESH_TOKENS = 6;
    // Personal access tokens for the user.
    PERSONAL_ACCESS_TOKENS = 7;
    // Per-user tag metadata.
    TAGS = 8;
    // The daily review preferences of the user.
    REVIEW = 9;
    // The diary preferences of the user.
    DIARY = 10;
    // The AI readings of the user's diary days.
    DIARY_MOODS = 11;
  }

  int32 user_id = 1;

  Key key = 2;
  oneof value {
    GeneralUserSetting general = 3;
    MemoViewsUserSetting memo_views = 6;
    WebhooksUserSetting webhooks = 7;
    RefreshTokensUserSetting refresh_tokens = 8;
    PersonalAccessTokensUserSetting personal_access_tokens = 9;
    TagsUserSetting tags = 10;
    ReviewUserSetting review = 11;
    DiaryUserSetting diary = 12;
    DiaryMoodsUserSetting diary_moods = 13;
  }
}

message GeneralUserSetting {
  // The user's locale.
  string locale = 1;
  // The user's memo visibility setting.
  string memo_visibility = 2;
  // The user's theme preference.
  // This references a CSS file in the web/public/themes/ directory.
  string theme = 3;
  // Whether the official client should save metadata from future media uploads.
  bool save_media_metadata = 4;
}

message UserTagMetadata {
  // Optional background color for the tag label.
  // When unset, the default tag color is used.
  google.type.Color background_color = 1;
  // Whether memos with this tag should have their content blurred.
  bool blur_content = 2;
  // Optional display icon shown in place of the tag's hash mark.
  // When unset, clients fall back to a leading emoji in the tag name, then the hash mark.
  Icon icon = 3;

  message Icon {
    oneof value {
      // A Unicode emoji sequence.
      string emoji = 1;
      // A canonical Lucide icon name, such as "leaf".
      string lucide = 2;
    }
  }
}

message TagsUserSetting {
  // Map of tag name pattern to tag metadata.
  // Each key is treated as an anchored regular expression (^pattern$),
  // so a single entry like "project/.*" matches all tags under that prefix.
  // Exact tag names are also valid.
  map<string, UserTagMetadata> tags = 1;
}

message RefreshTokensUserSetting {
  message RefreshToken {
    // Unique identifier (matches 'tid' claim in JWT)
    string token_id = 1;
    // When the token expires
    google.protobuf.Timestamp expires_at = 2;
    // When the token was created
    google.protobuf.Timestamp created_at = 3;
    // Client information for session management UI
    ClientInfo client_info = 4;
    // Optional description
    string description = 5;
  }

  message ClientInfo {
    // User agent string of the client.
    string user_agent = 1;
    // IP address of the client.
    string ip_address = 2;
    // Optional. Device type (e.g., "mobile", "desktop", "tablet").
    string device_type = 3;
    // Optional. Operating system (e.g., "iOS 17.0", "Windows 11").
    string os = 4;
    // Optional. Browser name and version (e.g., "Chrome 119.0").
    string browser = 5;
  }

  repeated RefreshToken refresh_tokens = 1;
}

message PersonalAccessTokensUserSetting {
  message PersonalAccessToken {
    // Unique identifier for this token
    string token_id = 1;
    // SHA-256 hash of the actual token
    string token_hash = 2;
    // User-provided description
    string description = 3;
    // When the token expires (null = never)
    google.protobuf.Timestamp expires_at = 4;
    // When the token was created
    google.protobuf.Timestamp created_at = 5;
    // When the token was last used
    google.protobuf.Timestamp last_used_at = 6;
  }
  repeated PersonalAccessToken tokens = 1;
}

message MemoViewsUserSetting {
  message MemoView {
    string id = 1;
    string title = 2;
    string filter = 3;
    Icon icon = 4;

    message Icon {
      oneof value {
        // A Unicode emoji sequence.
        string emoji = 1;
        // A canonical Lucide icon name, such as "leaf".
        string lucide = 2;
      }
    }
  }
  repeated MemoView memo_views = 1;
}

message WebhooksUserSetting {
  message Webhook {
    // Unique identifier for the webhook
    string id = 1;
    // Descriptive title for the webhook
    string title = 2;
    // The webhook URL endpoint
    string url = 3;
    // Optional signing secret for webhook authentication.
    string signing_secret = 4;
  }
  repeated Webhook webhooks = 1;
}

// ReviewUserSetting configures the user's daily review: which of their memos
// are eligible, and how many are surfaced each day.
message ReviewUserSetting {
  // Condition selects eligible memos by tag.
  enum Condition {
    CONDITION_UNSPECIFIED = 0;
    // Every memo is eligible.
    ALL_MEMOS = 1;
    // Only memos carrying one of `tags`, including their nested children.
    INCLUDE_TAGS = 2;
    // Every memo except those carrying one of `tags` or a nested child.
    EXCLUDE_TAGS = 3;
    // Only memos with no tag at all.
    UNTAGGED = 4;
  }

  // TimeRange bounds how far back the review reaches, by creation time.
  enum TimeRange {
    TIME_RANGE_UNSPECIFIED = 0;
    ALL_TIME = 1;
    LAST_MONTH = 2;
    LAST_3_MONTHS = 3;
    LAST_6_MONTHS = 4;
    LAST_YEAR = 5;
  }

  Condition condition = 1;

  // tags applies to INCLUDE_TAGS and EXCLUDE_TAGS. Stored in bare form,
  // without a leading "#".
  repeated string tags = 2;

  TimeRange time_range = 3;

  // daily_count is how many memos one day's review contains.
  int32 daily_count = 4;
}

// DiaryUserSetting configures the user's diary: which of their memos are diary
// entries, and whether each day is read for its mood.
message DiaryUserSetting {
  // tags mark a memo as a diary entry. A memo matches when it carries one of
  // these tags or a nested child of it, so "diary" also reaches "diary/travel".
  // Stored in bare form, without a leading "#". An empty list means the diary
  // falls back to the built-in default tags.
  repeated string tags = 1;

  // mood_analysis asks the configured provider to read each diary day's mood.
  // Absent means enabled, so a reader who never opened the settings still gets
  // whatever the instance configured.
  optional bool mood_analysis = 2;
}

// DiaryMoodsUserSetting holds the readings already taken of the user's diary
// days, newest day first. A reading is derived from the memos of one day and
// can always be taken again, so the list is pruned instead of kept forever.
message DiaryMoodsUserSetting {
  repeated DiaryMood moods = 1;
}

// DiaryMood is one diary day read for its mood.
message DiaryMood {
  // date is the author's own calendar day, formatted "YYYY-MM-DD".
  string date = 1;

  // label is a short mood name, written in the language of the day's memos.
  string label = 2;

  // emoji is a single emoji standing for the mood.
  string emoji = 3;

  // score is how bright the day reads, from -100 to 100.
  int32 score = 4;

  // summary is a sentence or two addressed to the author.
  string summary = 5;

  // keywords are the few themes the day turned on.
  repeated string keywords = 6;

  // memo_count is how many diary memos the reading was taken from.
  int32 memo_count = 7;

  // source_digest identifies the exact memos and revisions behind the reading,
  // so an unchanged day is never read twice.
  string source_digest = 8;

  // model records which model produced the reading.
  string model = 9;

  // updated_ts is when the reading was taken, in seconds since the epoch.
  int64 updated_ts = 10;
}
